name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanbase-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy and smoke preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ vars.APP_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm verify
      - run: pnpm cf:typegen
      - run: git diff --exit-code -- src/worker-configuration.d.ts
      - run: pnpm cf:deploy:preview
      - run: pnpm smoke -- --url "${{ vars.APP_URL }}" --environment preview

  production:
    name: Approve, deploy, and smoke production
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm cf:deploy:production
      - run: pnpm smoke -- --url "${{ vars.APP_URL }}" --environment production
