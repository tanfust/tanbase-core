name: Production performance

# Audits the production site after each deploy. It reports and never blocks
# a merge: Lighthouse scores vary from run to run. Forks set the
# PRODUCTION_URL repository variable to audit their own site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: production-performance
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse and landing JavaScript
    if: github.repository == 'tanfust/tanbase-core' || vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://core.tanbase.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the Workers Build of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] | "\(.status) \(.conclusion)"')
            echo "Workers Build: ${state:-not started}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::The Workers Build did not succeed"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No finished Workers Build after 20 minutes"
          exit 1
      - run: pnpm perf:bundle -- --url "$PRODUCTION_URL"
      # Five runs, since a single slow response can cost one run 15 points.
      # The landing JavaScript check above has already warmed the edge cache.
      - run: pnpm perf:lighthouse -- --url "$PRODUCTION_URL" --runs 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-production
          path: output/lighthouse
          if-no-files-found: ignore
