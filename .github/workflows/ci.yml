name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24.0.0, 26.0.0]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  cloudflare:
    name: Cloudflare types and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:typegen
      - run: git diff --exit-code -- src/worker-configuration.d.ts
      - run: pnpm cf:dry-run:production
      # The top-level configuration, which the Deploy to Cloudflare button uses.
      - run: pnpm cf:dry-run:default
      # Builds strip dead server-only imports that the dev server still loads.
      - run: pnpm test:dev-client

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          # Lighthouse needs Node.js 22.19 or newer.
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # env.local serves without Cloudflare credentials: the top level binds
      # Workers AI, which only runs remotely. The browser bundle is the same.
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: local
      - name: Serve the build
        run: |
          pnpm exec vite preview --port 4391 --strictPort > preview.log 2>&1 &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:4391/
      - run: pnpm perf:bundle -- --url http://localhost:4391
      # Blog pages load the same entry; the index stands in for every post.
      - run: pnpm perf:bundle -- --url http://localhost:4391 --path /blog
      - run: pnpm perf:lighthouse -- --url http://localhost:4391 --compress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-local-build
          path: output/lighthouse
          if-no-files-found: ignore
